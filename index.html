<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RRZE Store</title>

        <link rel="stylesheet" href="css/style.css">

        <script src="js/script.js" defer></script>
    </head>
    <body>
        <div class="container-product">
            <div class="navbar">
                <div class="logo">RZ</div>
            <div class="search-container">

                <input 
                    class="search-bar"
                    placeholder="Search product....."
                    id="search"
                >

                <button class="search-btn" id="search-btn">
                🔍
                </button>

                </div>
                <button class="cart" id="cart">🛒 cart </button>
            </div>
            <hr class="hr">
            <div class="container-categories">
                <div class="categories-box">
                    <p>categories :</p>
                    <button class="categories" data-category="all">
                        all
                    </button>
                    <button class="categories" data-category="electronics">
                        electronic
                    </button>
                    <button class="categories" data-category="jewelery">
                        jewelery
                    </button>
                    <button class="categories"data-category="men's clothing">
                        men's
                    </button>
                    <button class="categories"data-category="women's clothing">
                        women's
                    </button>
                </div>
                <hr class="hr">
            </div>
            <div class="product" id="product-container">
            </div>
            <div class="pagination">
                <div class="pagination-box">1</div> 
                <div class="pagination-box">2</div>
                <div class="pagination-box">3</div>
            </div>
        </div>
        <div class="list-buy hidden">
            <div class="your-cart">
                <p class="bold">your cart</p>
                <div class="cart-header">
                    <p class="product-info">product</p>
                    <p class="qty">qty</p>
                    <p class="price">price</p>
                    <p class="total">total</p>
                </div>
                <div class="cart-container"></div><!--list product in cart-->
                <hr>
                <div class="total-price">
                    <div class="textPrice bold"> TOTAL: </div>
                    <div class="NumberPrice"></div>
                </div>
                <div class="checkout-box">
                    <div class="checkout">
                        <p class="bold">checkout</p>
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
